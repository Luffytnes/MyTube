events {}

http {
    server_tokens off;

    # Increase timeouts for video streaming
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout       3600s;

    # Larger buffers for HLS segments
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Text assets only — media streams are already compressed
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/vtt application/javascript
                      application/json image/svg+xml application/manifest+json
                      application/vnd.apple.mpegurl application/dash+xml;

    # Only send "Connection: upgrade" for real WebSocket requests, so ordinary
    # requests keep upstream keep-alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Basic authentication — credentials managed via setup-auth.sh
        auth_basic           "MyTube";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        # Security headers (a location with its own add_header drops these)
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header Referrer-Policy         "no-referrer"   always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # Internal health probe — no authentication required
        location = /_health {
            auth_basic off;
            return 200 "ok\n";
            add_header Content-Type text/plain always;
        }

        # YouTube.js route handlers live in Next.js under /api/yt/ — the longer
        # prefix wins over /api/ below, which would otherwise send them to FastAPI.
        location /api/yt/ {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Backend API + HLS streams
        location /api/ {
            proxy_pass         http://backend:8000;
            # $http_host keeps the external port (e.g. :54321), unlike $host
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_buffering    off;
        }

        # FastAPI interactive docs
        location /docs {
            proxy_pass http://backend:8000;
        }
        location /openapi.json {
            proxy_pass http://backend:8000;
        }

        # Everything else → Next.js frontend
        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}
